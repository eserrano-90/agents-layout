# NOTE: pinned to 3.0.0 deliberately. @asyncapi/modelina v5.10.1 hardcodes
# `supportedVersions: ['3.0.0']` in its AsyncAPIInputProcessor. Bumping to
# 3.1.0 makes Modelina fall through to a generic JSON-schema parser that emits
# only `export type Root = any` instead of our 52 named interfaces. Bump when
# Modelina adds 3.1.0 support; the upgrade is `npx asyncapi convert` + a regen.
# `npm run asyncapi:validate` will keep emitting an info note recommending 3.1.0;
# that's expected and harmless until Modelina catches up.
asyncapi: 3.0.0
info:
  title: Pixel Agents Protocol
  version: 1.0.0
  description: |
    Bidirectional WebSocket protocol between the Pixel Agents server and any UI client
    (the bundled VS Code webview, the standalone browser SPA, or future third-party
    clients). The server watches AI-coding-agent transcripts, parses tool activity, 
    owns office layout, and streams events to all connected clients. 
    Clients send commands to launch agents, save layout, and toggle settings.

    The protocol is provider-agnostic: a HookProvider implementation defines how raw
    CLI events are normalized to the AgentEvent shape, which the server translates
    into ServerMessage broadcasts.

    A second, one-way HTTP channel (`/api/ingest`) carries normalized agent events
    from emitting clients to the server. Clients observe agent sessions on the
    developer's machine; the server only receives events and renders them. Any
    program that posts contract-conforming IngestRequest batches with a valid
    token is a valid client.
  license:
    name: MIT
  contact:
    name: Pixel Agents
    url: https://github.com/pablodelucca/pixel-agents

servers:
  local:
    host: 127.0.0.1:3100
    protocol: ws
    description: Local Pixel Agents server (default port 3100)
    pathname: /ws
  ingest:
    host: 127.0.0.1:3100
    protocol: http
    description: HTTP ingest endpoint of the Pixel Agents server (same port as /ws)

channels:
  ws:
    address: /ws
    description: |
      Single bidirectional channel. The server pushes ServerMessage events on agent
      lifecycle, tool activity, asset loading, and settings. Clients send
      ClientMessage commands.
    messages:
      ServerMessage:
        $ref: '#/components/messages/ServerMessage'
      ClientMessage:
        $ref: '#/components/messages/ClientMessage'
  ingest:
    address: /api/ingest
    description: |
      One-way event ingestion. An emitting client POSTs an IngestRequest (a batch of
      normalized agent events, authenticated with `Authorization: Bearer <token>`)
      and the server answers with an IngestResponse. The server never initiates;
      anything it needs from a client (a resync) is requested in the response.
    servers:
      - $ref: '#/servers/ingest'
    messages:
      IngestRequest:
        $ref: '#/components/messages/IngestRequest'
      IngestResponse:
        $ref: '#/components/messages/IngestResponse'

operations:
  receiveServerMessage:
    action: receive
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ServerMessage'
  sendClientMessage:
    action: send
    channel:
      $ref: '#/channels/ws'
    messages:
      - $ref: '#/channels/ws/messages/ClientMessage'
  sendIngestRequest:
    action: send
    channel:
      $ref: '#/channels/ingest'
    bindings:
      http:
        method: POST
    messages:
      - $ref: '#/channels/ingest/messages/IngestRequest'
    reply:
      channel:
        $ref: '#/channels/ingest'
      messages:
        - $ref: '#/channels/ingest/messages/IngestResponse'

components:
  messages:
    ServerMessage:
      title: Server-to-client message
      summary: Any message broadcast by the server to connected clients.
      payload:
        $ref: '#/components/schemas/ServerMessage'
    ClientMessage:
      title: Client-to-server message
      summary: Any command sent by a client to the server.
      payload:
        $ref: '#/components/schemas/ClientMessage'
    IngestRequest:
      title: Client-to-server event batch
      summary: A batch of normalized agent events from one emitting client.
      payload:
        $ref: '#/components/schemas/IngestRequest'
    IngestResponse:
      title: Server reply to an event batch
      summary: Acknowledgement, rejection, or resync request for a batch.
      payload:
        $ref: '#/components/schemas/IngestResponse'

  schemas:
    # ── Top-level discriminated unions ────────────────────────────

    ServerMessage:
      oneOf:
        # Provider capabilities
        - $ref: '#/components/schemas/ProviderCapabilities'
        # Agent lifecycle
        - $ref: '#/components/schemas/AgentCreated'
        - $ref: '#/components/schemas/AgentClosed'
        - $ref: '#/components/schemas/AgentSelected'
        - $ref: '#/components/schemas/ExistingAgents'
        # Agent status / tool activity
        - $ref: '#/components/schemas/AgentStatus'
        - $ref: '#/components/schemas/AgentToolStart'
        - $ref: '#/components/schemas/AgentToolDone'
        - $ref: '#/components/schemas/AgentToolsClear'
        - $ref: '#/components/schemas/AgentToolPermission'
        - $ref: '#/components/schemas/AgentToolPermissionClear'
        # Sub-agent activity
        - $ref: '#/components/schemas/SubagentToolStart'
        - $ref: '#/components/schemas/SubagentToolDone'
        - $ref: '#/components/schemas/SubagentClear'
        - $ref: '#/components/schemas/SubagentToolPermission'
        # Agent Teams
        - $ref: '#/components/schemas/AgentTeamInfo'
        - $ref: '#/components/schemas/AgentTokenUsage'
        - $ref: '#/components/schemas/AgentModelInfo'
        - $ref: '#/components/schemas/DailyUsage'
        # Emitting clients
        - $ref: '#/components/schemas/AgentClientLabels'
        # Layout
        - $ref: '#/components/schemas/LayoutLoaded'
        # Assets
        - $ref: '#/components/schemas/FurnitureAssetsLoaded'
        - $ref: '#/components/schemas/CharacterSpritesLoaded'
        - $ref: '#/components/schemas/PetSpritesLoaded'
        - $ref: '#/components/schemas/FloorTilesLoaded'
        - $ref: '#/components/schemas/WallTilesLoaded'
        # Settings & config
        - $ref: '#/components/schemas/SettingsLoaded'
        - $ref: '#/components/schemas/ExternalAssetDirectoriesUpdated'
        - $ref: '#/components/schemas/WorkspaceFolders'
        # Diagnostics
        - $ref: '#/components/schemas/AgentDiagnostics'
      discriminator: type

    ClientMessage:
      oneOf:
        - $ref: '#/components/schemas/WebviewReady'
        - $ref: '#/components/schemas/LaunchAgent'
        - $ref: '#/components/schemas/FocusAgent'
        - $ref: '#/components/schemas/CloseAgent'
        - $ref: '#/components/schemas/SaveAgentSeats'
        - $ref: '#/components/schemas/SaveLayout'
        - $ref: '#/components/schemas/SetSoundEnabled'
        - $ref: '#/components/schemas/SetLastSeenVersion'
        - $ref: '#/components/schemas/SetAlwaysShowLabels'
        - $ref: '#/components/schemas/SetHooksEnabled'
        - $ref: '#/components/schemas/SetHooksInfoShown'
        - $ref: '#/components/schemas/SetWatchAllSessions'
        - $ref: '#/components/schemas/ExportLayout'
        - $ref: '#/components/schemas/ImportLayout'
        - $ref: '#/components/schemas/OpenSessionsFolder'
        - $ref: '#/components/schemas/AddExternalAssetDirectory'
        - $ref: '#/components/schemas/RemoveExternalAssetDirectory'
        - $ref: '#/components/schemas/RequestDiagnostics'
      discriminator: type

    # ── Server message variants ────────────────────────────────────

    ProviderCapabilities:
      description: |
        Sent once after `webviewReady`, before any agent messages. Tells the client
        which tool names should render with the "reading" animation and which spawn
        sub-agent characters.
      type: object
      additionalProperties: false
      required: [type, readingTools, subagentToolNames]
      properties:
        type:
          const: providerCapabilities
        readingTools:
          type: array
          items:
            type: string
          description: Tool names that should render the reading animation (vs typing).
        subagentToolNames:
          type: array
          items:
            type: string
          description: Tool names that spawn sub-agent characters (e.g. Task, Agent).

    AgentCreated:
      description: A new agent has appeared in the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentCreated
        id:
          type: integer
        folderName:
          type: string
        isExternal:
          type: boolean
        clientLabel:
          type: string
          description: >-
            Label of the emitting client this agent belongs to. Only present
            when more than one client is connected.

    AgentClosed:
      description: An agent has been removed from the office.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentClosed
        id:
          type: integer

    AgentSelected:
      description: An agent's terminal was focused (VS Code only). UI should highlight it.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentSelected
        id:
          type: integer

    ExistingAgents:
      description: |
        Snapshot of all current agents. Sent on initial connect and after agent set
        changes that the client missed. Includes seat/palette assignments.
      type: object
      additionalProperties: false
      required: [type, agents, agentMeta, folderNames, externalAgents]
      properties:
        type:
          const: existingAgents
        agents:
          type: array
          items:
            type: integer
        agentMeta:
          type: object
          description: Map of agent ID (string) to seat metadata.
          additionalProperties:
            $ref: '#/components/schemas/AgentSeatMeta'
        folderNames:
          type: object
          description: Map of agent ID (string) to workspace folder name.
          additionalProperties:
            type: string
        externalAgents:
          type: object
          description: Map of agent ID (string) to external flag.
          additionalProperties:
            type: boolean
        clientLabels:
          type: object
          description: >-
            Map of agent ID (string) to the label of the emitting client it
            belongs to. Only present when more than one client is connected.
          additionalProperties:
            type: string

    AgentStatus:
      description: Active vs waiting state for an agent (drives character animation).
      type: object
      additionalProperties: false
      required: [type, id, status]
      properties:
        type:
          const: agentStatus
        id:
          type: integer
        status:
          $ref: '#/components/schemas/AgentActivityStatus'
        awaitingInput:
          type: boolean
          description: >-
            Only meaningful when status is "waiting". True when the agent went
            idle waiting on the user (drives the "Waiting for input" label);
            absent/false means the agent finished its turn ("Done").

    AgentActivityStatus:
      description: Activity state of an agent.
      type: string
      enum: [active, waiting]

    AgentToolStart:
      description: Agent began executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId, status]
      properties:
        type:
          const: agentToolStart
        id:
          type: integer
        toolId:
          type: string
        status:
          type: string
          description: Human-readable status to display (e.g. "Reading foo.ts").
        toolName:
          type: string
        permissionActive:
          type: boolean
        runInBackground:
          type: boolean

    AgentToolDone:
      description: Agent finished executing a tool.
      type: object
      additionalProperties: false
      required: [type, id, toolId]
      properties:
        type:
          const: agentToolDone
        id:
          type: integer
        toolId:
          type: string

    AgentToolsClear:
      description: All foreground tools cleared (turn end). Background agents preserved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolsClear
        id:
          type: integer

    AgentToolPermission:
      description: Permission prompt detected for the agent's current tool.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermission
        id:
          type: integer

    AgentToolPermissionClear:
      description: Permission prompt resolved.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentToolPermissionClear
        id:
          type: integer

    SubagentToolStart:
      description: Sub-agent (e.g. Task) started a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId, status]
      properties:
        type:
          const: subagentToolStart
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string
        status:
          type: string

    SubagentToolDone:
      description: Sub-agent finished a tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId, toolId]
      properties:
        type:
          const: subagentToolDone
        id:
          type: integer
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentClear:
      description: A sub-agent task completed.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentClear
        id:
          type: integer
        parentToolId:
          type: string

    SubagentToolPermission:
      description: Permission prompt for a sub-agent's tool.
      type: object
      additionalProperties: false
      required: [type, id, parentToolId]
      properties:
        type:
          const: subagentToolPermission
        id:
          type: integer
        parentToolId:
          type: string

    AgentTeamInfo:
      description: Agent Teams metadata (lead, teammate, tmux usage).
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: agentTeamInfo
        id:
          type: integer
        teamName:
          type: string
        agentName:
          type: string
        isTeamLead:
          type: boolean
        leadAgentId:
          type: integer
        teamUsesTmux:
          type: boolean

    AgentTokenUsage:
      description: Cumulative token usage for the agent's session.
      type: object
      additionalProperties: false
      required: [type, id, inputTokens, outputTokens]
      properties:
        type:
          const: agentTokenUsage
        id:
          type: integer
        inputTokens:
          type: integer
        outputTokens:
          type: integer

    AgentModelInfo:
      description: The model backing the agent's current session (e.g. claude-opus-4-8). Re-sent when the model changes mid-session.
      type: object
      additionalProperties: false
      required: [type, id, model]
      properties:
        type:
          const: agentModelInfo
        id:
          type: integer
        model:
          type: string

    AgentClientLabels:
      description: |
        Client label of every agent, sent whenever the set of connected clients
        changes. Labels are only shown when more than one client is connected;
        an empty map means "show no client labels".
      type: object
      additionalProperties: false
      required: [type, labels]
      properties:
        type:
          const: agentClientLabels
        labels:
          type: object
          description: Map of agent ID (string) to client label.
          additionalProperties:
            type: string

    DailyUsage:
      description: |
        Global token usage and estimated cost for the current calendar day,
        aggregated across all agents and broken down by model. Broadcast whenever
        usage changes and replayed on connect. Cost is a USD estimate from static
        per-model rates (cache/batch discounts not modeled).
      type: object
      additionalProperties: false
      required: [type, date, inputTokens, outputTokens, costUsd, models]
      properties:
        type:
          const: dailyUsage
        date:
          type: string
          description: Local calendar day, YYYY-MM-DD.
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        costUsd:
          type: number
        models:
          type: array
          items:
            $ref: '#/components/schemas/DailyUsageModel'

    DailyUsageModel:
      description: Per-model token/cost breakdown within a DailyUsage message.
      type: object
      additionalProperties: false
      required: [model, inputTokens, outputTokens, costUsd]
      properties:
        model:
          type: string
        inputTokens:
          type: integer
        outputTokens:
          type: integer
        costUsd:
          type: number

    LayoutLoaded:
      description: |
        Office layout (tiles, furniture, colors). `null` when no layout file or
        bundled default exists. `wasReset` is true when the bundled default
        replaced an outdated user layout.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: layoutLoaded
        layout:
          oneOf:
            - type: object
              description: |
                Opaque layout object (cols, rows, tiles, furniture, tileColors).
                Format defined by the OfficeLayout schema in webview-ui; not
                modeled here because it's owned by the rendering layer.
            - type: 'null'
        wasReset:
          type: boolean

    FurnitureAssetsLoaded:
      description: Furniture catalog and sprite data, sent once after webviewReady.
      type: object
      additionalProperties: false
      required: [type, catalog, sprites]
      properties:
        type:
          const: furnitureAssetsLoaded
        catalog:
          type: array
          items:
            $ref: '#/components/schemas/FurnitureAssetMessage'
        sprites:
          type: object
          description: Map of furniture asset ID to its sprite (2D hex string array).
          additionalProperties:
            type: array
            items:
              type: array
              items:
                type: string

    CharacterSpritesLoaded:
      description: Pre-colored character sprite sets (6 palettes), sent once at startup.
      type: object
      additionalProperties: false
      required: [type, characters]
      properties:
        type:
          const: characterSpritesLoaded
        characters:
          type: array
          items:
            $ref: '#/components/schemas/CharacterSpriteSet'

    PetSpritesLoaded:
      description: Pet sprite frame sets and display names, sent once after webviewReady (between characterSpritesLoaded and floorTilesLoaded).
      type: object
      additionalProperties: false
      required: [type, pets, petNames]
      properties:
        type:
          const: petSpritesLoaded
        pets:
          type: array
          description: One frame-set per loaded pet, indexed by petType.
          items:
            $ref: '#/components/schemas/PetSpriteFrameSet'
        petNames:
          type: array
          description: Display names parallel-indexed to `pets` (sourced from each pet's manifest.json).
          items:
            type: string

    PetSpriteFrameSet:
      description: One pet's frames keyed by direction + state. All arrays are 3D hex-string arrays (frames × rows × pixels).
      type: object
      additionalProperties: false
      required: [walkDown, idleDown, walkUp, idleUp, walkRight]
      properties:
        walkDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleDown:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        idleUp:
          type: array
          description: 3 frames at 16×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string
        walkRight:
          type: array
          description: 3 frames at 32×32 pixels.
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FloorTilesLoaded:
      description: Floor tile sprites (7 patterns).
      type: object
      additionalProperties: false
      required: [type, sprites]
      properties:
        type:
          const: floorTilesLoaded
        sprites:
          type: array
          description: Array of 2D hex string arrays (one per pattern).
          items:
            type: array
            items:
              type: array
              items:
                type: string

    WallTilesLoaded:
      description: Wall auto-tile sprite sets (16 bitmask pieces).
      type: object
      additionalProperties: false
      required: [type, sets]
      properties:
        type:
          const: wallTilesLoaded
        sets:
          type: array
          description: Array of wall tile sets; each set is an array of 2D hex string arrays.
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items:
                  type: string

    SettingsLoaded:
      description: All persisted user-level settings, sent once on connect.
      type: object
      additionalProperties: false
      required:
        - type
        - soundEnabled
        - lastSeenVersion
        - extensionVersion
        - watchAllSessions
        - alwaysShowLabels
        - hooksEnabled
        - hooksInfoShown
        - externalAssetDirectories
      properties:
        type:
          const: settingsLoaded
        soundEnabled:
          type: boolean
        lastSeenVersion:
          type: string
        extensionVersion:
          type: string
        watchAllSessions:
          type: boolean
        alwaysShowLabels:
          type: boolean
        hooksEnabled:
          type: boolean
        hooksInfoShown:
          type: boolean
        externalAssetDirectories:
          type: array
          items:
            type: string
        localClient:
          type: boolean
          description: >-
            True when the server has a co-located emitting client (all-in-one
            mode). The hooks and watch-all-sessions settings act on that client;
            when false or absent in server-only mode the UI hides them.

    ExternalAssetDirectoriesUpdated:
      description: External asset directory list changed (after add/remove).
      type: object
      additionalProperties: false
      required: [type, dirs]
      properties:
        type:
          const: externalAssetDirectoriesUpdated
        dirs:
          type: array
          items:
            type: string

    WorkspaceFolders:
      description: Multi-root workspace folders (VS Code only).
      type: object
      additionalProperties: false
      required: [type, folders]
      properties:
        type:
          const: workspaceFolders
        folders:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceFolder'

    AgentDiagnostics:
      description: Connection diagnostics for all agents (response to requestDiagnostics).
      type: object
      additionalProperties: false
      required: [type, agents]
      properties:
        type:
          const: agentDiagnostics
        agents:
          type: array
          description: Per-agent diagnostic info; shape opaque to the protocol.
          items:
            type: object

    # ── Client message variants ────────────────────────────────────

    WebviewReady:
      description: Client signals it's ready to receive state.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: webviewReady

    LaunchAgent:
      description: Launch a new Claude agent in a new terminal.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: launchAgent
        folderPath:
          type: string
          description: Workspace folder path (for multi-root workspaces).
        bypassPermissions:
          type: boolean

    FocusAgent:
      description: Focus an agent's terminal.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: focusAgent
        id:
          type: integer

    CloseAgent:
      description: Close (dismiss) an agent.
      type: object
      additionalProperties: false
      required: [type, id]
      properties:
        type:
          const: closeAgent
        id:
          type: integer

    SaveAgentSeats:
      description: Persist seat assignments for current agents.
      type: object
      additionalProperties: false
      required: [type, seats]
      properties:
        type:
          const: saveAgentSeats
        seats:
          type: object
          description: Map of agent ID (string) to seat assignment.
          additionalProperties:
            $ref: '#/components/schemas/SeatAssignment'

    SaveLayout:
      description: Save the office layout to ~/.pixel-agents/layout.json.
      type: object
      additionalProperties: false
      required: [type, layout]
      properties:
        type:
          const: saveLayout
        layout:
          type: object
          description: Opaque layout object; format owned by the rendering layer.

    SetSoundEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setSoundEnabled
        enabled:
          type: boolean

    SetLastSeenVersion:
      type: object
      additionalProperties: false
      required: [type, version]
      properties:
        type:
          const: setLastSeenVersion
        version:
          type: string

    SetAlwaysShowLabels:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setAlwaysShowLabels
        enabled:
          type: boolean

    SetHooksEnabled:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setHooksEnabled
        enabled:
          type: boolean

    SetHooksInfoShown:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: setHooksInfoShown

    SetWatchAllSessions:
      type: object
      additionalProperties: false
      required: [type, enabled]
      properties:
        type:
          const: setWatchAllSessions
        enabled:
          type: boolean

    ExportLayout:
      description: Trigger layout export via host-native save dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: exportLayout

    ImportLayout:
      description: Trigger layout import via host-native open dialog.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: importLayout

    OpenSessionsFolder:
      description: Open ~/.claude/projects in the OS file manager.
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: openSessionsFolder

    AddExternalAssetDirectory:
      description: Add an external asset directory (host shows a directory picker).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: addExternalAssetDirectory

    RemoveExternalAssetDirectory:
      description: Remove an external asset directory by path.
      type: object
      additionalProperties: false
      required: [type, path]
      properties:
        type:
          const: removeExternalAssetDirectory
        path:
          type: string

    RequestDiagnostics:
      description: Request agent connection diagnostics (server responds with agentDiagnostics).
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          const: requestDiagnostics

    # ── Supporting schemas ─────────────────────────────────────────

    AgentSeatMeta:
      description: |
        Seat metadata associated with an agent (palette index, hue shift, seat ID).
        Used in `existingAgents.agentMeta`. All fields optional because some agents
        may not have a seat assignment yet.
      type: object
      additionalProperties: false
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: string

    SeatAssignment:
      description: |
        Required seat assignment payload sent in `saveAgentSeats`. `seatId` may be
        null when the agent is unseated (left their chair). All other fields required.
      type: object
      additionalProperties: false
      required: [palette, hueShift, seatId]
      properties:
        palette:
          type: integer
        hueShift:
          type: integer
        seatId:
          type: [string, 'null']

    WorkspaceFolder:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string

    CharacterSpriteSet:
      description: |
        One palette's character sprites as 3D hex-string arrays (frames × rows × pixels).
        Three direction sets per palette: down, up, right (left is rendered as flipped right).
      type: object
      additionalProperties: false
      required: [down, up, right]
      properties:
        down:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        up:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string
        right:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: string

    FurnitureAssetMessage:
      description: One entry in the furniture catalog (sent in `furnitureAssetsLoaded`).
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - label
        - category
        - file
        - width
        - height
        - footprintW
        - footprintH
        - isDesk
        - canPlaceOnWalls
      properties:
        id:
          type: string
        name:
          type: string
        label:
          type: string
        category:
          type: string
        file:
          type: string
        width:
          type: integer
        height:
          type: integer
        footprintW:
          type: integer
        footprintH:
          type: integer
        isDesk:
          type: boolean
        canPlaceOnWalls:
          type: boolean
        groupId:
          type: string
        canPlaceOnSurfaces:
          type: boolean
        backgroundTiles:
          type: integer
        orientation:
          type: string
        state:
          type: string
        mirrorSide:
          type: boolean
        rotationScheme:
          type: string
        animationGroup:
          type: string
        frame:
          type: integer

    # ── Ingest contract (emitting client → server, POST /api/ingest) ──

    IngestRequest:
      description: |
        One batch of normalized agent events from a single emitting client. An empty
        `events` array is a heartbeat. Batches from one client are applied in `seq`
        order; a batch whose `seq` was already applied is acknowledged and ignored.
      type: object
      additionalProperties: false
      required: [protocolVersion, clientId, seq, sentAt, events]
      properties:
        protocolVersion:
          type: integer
          minimum: 1
          description: Ingest contract version this request was built for.
        clientId:
          type: string
          minLength: 1
          maxLength: 128
          description: Stable identifier of the emitting client. Must match the token's client.
        label:
          type: string
          maxLength: 128
          description: Human-readable client label shown in the office (e.g. "ana@laptop").
        seq:
          type: integer
          minimum: 1
          description: >-
            Per-client batch counter. Starts at 1 for each client process and
            increases by 1 per batch. A request carrying `snapshot` resets the
            server's expectation to this value.
        sentAt:
          type: number
          description: Client clock at send time (ms since epoch).
        events:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/IngestEvent'
        snapshot:
          $ref: '#/components/schemas/IngestSnapshot'
        goodbye:
          type: boolean
          description: True on the client's final batch before a clean shutdown.

    IngestEvent:
      description: One normalized agent event for one session.
      type: object
      additionalProperties: false
      required: [sessionId, origin, ts, event]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 256
          description: Session identifier, unique within the emitting client.
        origin:
          $ref: '#/components/schemas/IngestEventOrigin'
        ts:
          type: number
          description: Client clock when the event was observed (ms since epoch).
        event:
          $ref: '#/components/schemas/AgentEvent'

    IngestEventOrigin:
      description: |
        Where the client observed the event. `hook` events come from the agent
        tool's hooks API (instant, authoritative); `transcript` events are derived
        from the session transcript. The server suppresses its heuristic timers
        for a session once it has seen a `hook` event for it.
      type: string
      enum: [hook, transcript]

    IngestSnapshot:
      description: |
        The complete list of sessions that are live on the client. Sent on the
        client's first request, after the server asks for a resync, and after the
        client dropped events from its queue. The server makes that client's
        agents match this list.
      type: object
      additionalProperties: false
      required: [sessions]
      properties:
        sessions:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/IngestSnapshotSession'

    IngestSnapshotSession:
      description: One live session in a snapshot, with what the server needs to rebuild it.
      type: object
      additionalProperties: false
      required: [sessionId]
      properties:
        sessionId:
          type: string
          minLength: 1
          maxLength: 256
        folderName:
          type: string
        cwd:
          type: string
          description: Working directory on the client's machine. Opaque label for the server.
        transcriptPath:
          type: string
          description: Transcript path on the client's machine. Opaque label for the server.
        hooksOnly:
          type: boolean
        hookDelivered:
          type: boolean
          description: True when the client has received hook events for this session.
        team:
          $ref: '#/components/schemas/SessionTeam'

    IngestResponse:
      description: Server reply to an IngestRequest.
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
        appliedSeq:
          type: integer
          description: Highest batch `seq` the server has applied for this client.
        resync:
          type: boolean
          description: True when the client must send a snapshot on its next request.
        error:
          type: string
        eventIndex:
          type: integer
          description: Index in `events` of the first event that failed validation.
        supportedVersions:
          type: array
          items:
            type: integer
          description: Contract versions this server accepts (sent on a version mismatch).

    SessionTeam:
      description: Team membership of a session (lead or teammate).
      type: object
      additionalProperties: false
      properties:
        teamName:
          type: string
        agentName:
          type: string
          description: Teammate name. Absent for the team lead.
        leadSessionId:
          type: string
          description: Session of the team lead, when this session is a teammate.
        isTeamLead:
          type: boolean
          description: True when this session is the lead of its team.
        usesTmux:
          type: boolean
          description: >-
            True when the team's teammates run as separate sessions with their
            own hooks, rather than in-process with the lead.

    AgentActivityKind:
      description: Which character animation a tool should play.
      type: string
      enum: [reading, typing]

    SubagentTurnEndReason:
      description: Why a sub-agent's turn ended.
      type: string
      enum: [idle, completed]

    AgentEvent:
      description: Normalized, tool-agnostic agent event.
      oneOf:
        - $ref: '#/components/schemas/SessionStartEvent'
        - $ref: '#/components/schemas/SessionEndEvent'
        - $ref: '#/components/schemas/SessionReplacedEvent'
        - $ref: '#/components/schemas/ToolStartEvent'
        - $ref: '#/components/schemas/ToolEndEvent'
        - $ref: '#/components/schemas/BackgroundToolEndEvent'
        - $ref: '#/components/schemas/TurnEndEvent'
        - $ref: '#/components/schemas/SubagentStartEvent'
        - $ref: '#/components/schemas/SubagentEndEvent'
        - $ref: '#/components/schemas/SubagentTurnEndEvent'
        - $ref: '#/components/schemas/ProgressEvent'
        - $ref: '#/components/schemas/PermissionRequestEvent'
        - $ref: '#/components/schemas/TextOutputEvent'
        - $ref: '#/components/schemas/UserPromptEvent'
        - $ref: '#/components/schemas/TokenUsageEvent'
        - $ref: '#/components/schemas/ModelInfoEvent'
        - $ref: '#/components/schemas/TeamInfoEvent'
      discriminator: kind

    SessionStartEvent:
      description: |
        A session became live on the client. Creates the agent when the server
        does not know the session yet; otherwise only confirms it.
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: sessionStart
        source:
          type: string
          description: Why the session started (e.g. startup, resume, clear).
        folderName:
          type: string
          description: Short project label to show next to the character.
        cwd:
          type: string
          description: Working directory on the client's machine. Opaque label for the server.
        transcriptPath:
          type: string
          description: Transcript path on the client's machine. Opaque label for the server.
        hooksOnly:
          type: boolean
          description: True when the session has no transcript and all state comes from hooks.
        team:
          $ref: '#/components/schemas/SessionTeam'

    SessionEndEvent:
      description: The session ended or went stale. Removes the agent.
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: sessionEnd
        reason:
          type: string

    SessionReplacedEvent:
      description: |
        The session in the wrapper's `sessionId` replaces `previousSessionId`
        (for example after a clear). The agent keeps its character and seat.
      type: object
      additionalProperties: false
      required: [kind, previousSessionId]
      properties:
        kind:
          const: sessionReplaced
        previousSessionId:
          type: string
        transcriptPath:
          type: string
          description: Transcript path of the new session. Opaque label for the server.

    ToolStartEvent:
      description: The agent began executing a tool.
      type: object
      additionalProperties: false
      required: [kind, toolId, toolName, statusText, activity, permissionExempt, spawnsSubagent]
      properties:
        kind:
          const: toolStart
        toolId:
          type: string
        toolName:
          type: string
        statusText:
          type: string
          maxLength: 256
          description: Human-readable status to display (e.g. "Reading main.ts").
        activity:
          $ref: '#/components/schemas/AgentActivityKind'
        permissionExempt:
          type: boolean
          description: True when the tool never waits on a user permission prompt.
        spawnsSubagent:
          type: boolean
          description: True when the tool spawns a sub-agent character.
        spawnsTeammate:
          type: boolean
          description: True when this specific call spawns a persistent teammate.
        runInBackground:
          type: boolean

    ToolEndEvent:
      description: |
        A tool finished. `toolId` is "current" when the source does not carry the
        id and the server should end the tool most recently started by a hook.
      type: object
      additionalProperties: false
      required: [kind, toolId]
      properties:
        kind:
          const: toolEnd
        toolId:
          type: string
        backgroundLaunched:
          type: boolean
          description: >-
            True when the result only confirms that a background sub-agent was
            launched; the sub-agent itself keeps running.

    BackgroundToolEndEvent:
      description: A background sub-agent tool reported its result through the queue.
      type: object
      additionalProperties: false
      required: [kind, toolId]
      properties:
        kind:
          const: backgroundToolEnd
        toolId:
          type: string
          description: Id of the background sub-agent tool that finished.

    TurnEndEvent:
      description: The agent finished its turn.
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: turnEnd
        awaitingInput:
          type: boolean
          description: True when the agent went idle waiting on the user.

    SubagentStartEvent:
      description: |
        A sub-agent started, or a sub-agent began a tool. `parentToolId` is
        "current" when the source does not carry it.
      type: object
      additionalProperties: false
      required: [kind, parentToolId, toolId, toolName, statusText, permissionExempt]
      properties:
        kind:
          const: subagentStart
        parentToolId:
          type: string
        toolId:
          type: string
        toolName:
          type: string
        statusText:
          type: string
          maxLength: 256
        permissionExempt:
          type: boolean
          description: True when the sub-agent's tool never waits on a user permission prompt.
        runInBackground:
          type: boolean

    SubagentEndEvent:
      description: A sub-agent stopped, or a sub-agent's tool finished.
      type: object
      additionalProperties: false
      required: [kind, parentToolId, toolId]
      properties:
        kind:
          const: subagentEnd
        parentToolId:
          type: string
        toolId:
          type: string

    SubagentTurnEndEvent:
      description: A teammate went idle or reported its task complete.
      type: object
      additionalProperties: false
      required: [kind, parentToolId, reason]
      properties:
        kind:
          const: subagentTurnEnd
        parentToolId:
          type: string
        reason:
          $ref: '#/components/schemas/SubagentTurnEndReason'
        teammateName:
          type: string
          description: Name of the teammate the event is about, when the source carries it.

    ProgressEvent:
      description: |
        Evidence that the session is still producing data. Without `toolId`: a
        new batch of transcript data arrived (the server cancels its heuristic
        timers). With `toolId`: that tool reported it is still running (the
        server restarts its permission heuristic for it).
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: progress
        toolId:
          type: string

    PermissionRequestEvent:
      description: The agent is waiting on a user permission prompt.
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: permissionRequest

    TextOutputEvent:
      description: The agent produced text without using a tool. Carries no text.
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: textOutput

    UserPromptEvent:
      description: The user submitted a prompt, starting a new turn. Carries no text.
      type: object
      additionalProperties: false
      required: [kind]
      properties:
        kind:
          const: userPrompt

    TokenUsageEvent:
      description: Token usage of one assistant message (deltas, not totals).
      type: object
      additionalProperties: false
      required: [kind, inputTokens, outputTokens]
      properties:
        kind:
          const: tokenUsage
        inputTokens:
          type: integer
          minimum: 0
        outputTokens:
          type: integer
          minimum: 0
        model:
          type: string

    ModelInfoEvent:
      description: The model backing the session.
      type: object
      additionalProperties: false
      required: [kind, model]
      properties:
        kind:
          const: modelInfo
        model:
          type: string

    TeamInfoEvent:
      description: |
        The session's team membership changed. Carries the complete membership as
        resolved by the client; the server replaces what it had.
      type: object
      additionalProperties: false
      required: [kind, team]
      properties:
        kind:
          const: teamInfo
        team:
          $ref: '#/components/schemas/SessionTeam'
